  const SWF_INFO = {"sig": "CWS", "version": 8, "compressedBytes": 305229, "declaredBytes": 468429, "width": 650.0, "height": 450.0, "fps": 24.0, "frames": 6};
  const SWF_URLS = ['assets/game.swf', 'game.swf'];
  const stage = document.getElementById('stage');
  const fileInput = document.getElementById('fileInput');
  const btnReload = document.getElementById('btnReload');
  const btnFullscreen = document.getElementById('btnFullscreen');
  const btnEmbedded = document.getElementById('btnEmbedded');
  const btnUrl = document.getElementById('btnUrl');
  const btnCopyDiag = document.getElementById('btnCopyDiag');
  const dropOverlay = document.getElementById('dropOverlay');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const diagnostics = document.getElementById('diagnostics');
  const stageWrap = document.querySelector('.stage-wrap');
  let rufflePlayer = null;
  let currentMode = 'embedded';
  let diagLines = [];

  function setStatus(state, msg) {
    statusDot.className = 'status-dot ' + state;
    statusText.textContent = msg;
    addDiag('STATUS', msg, state === 'error' ? 'err' : (state === 'ok' ? 'ok' : ''));
  }
  function escapeHtml(s) { return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'); }
  function addDiag(label, value, cls) {
    const time = new Date().toLocaleTimeString();
    const line = `[${time}] ${label}: ${value}`;
    diagLines.push(line);
    diagnostics.innerHTML = diagLines.map(x => escapeHtml(x)).join('\n');
    console.log('[launcher]', line);
  }
  function clearDiag() { diagLines = []; diagnostics.textContent = ''; }
  function clearStage() {
    stage.innerHTML = '';
    rufflePlayer = null;
  }
  function base64ToUint8Array(chunks) {
    const bin = atob(chunks.join(''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function makeError(title, detail) {
    clearStage();
    stage.innerHTML = '<div class="error-state"><div class="error-code">' + escapeHtml(title) + '</div><p>Ruffle 실행에 실패했습니다.<br>아래 세부 정보를 복사해서 보내주면 바로 원인 추적 가능합니다.</p><code>' + escapeHtml(detail) + '</code><button class="retry-btn" id="retryRun">재시도</button></div>';
    const retry = document.getElementById('retryRun');
    if (retry) retry.addEventListener('click', () => currentMode === 'url' ? runUrlMode() : runEmbeddedMode());
  }
  async function waitForRuffle(timeoutMs) {
    const start = Date.now();
    while (Date.now() - start < timeoutMs) {
      if (window.RufflePlayer && typeof window.RufflePlayer.newest === 'function') return window.RufflePlayer.newest();
      await new Promise(r => setTimeout(r, 80));
    }
    throw new Error('RufflePlayer.newest() 준비 실패 / ruffle 폴더 누락 가능');
  }
  function createPlayer() {
    clearStage();
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    player.style.width = '100%';
    player.style.height = '100%';
    player.style.display = 'block';
    player.setAttribute('tabindex', '0');
    stage.appendChild(player);
    rufflePlayer = player;
    return player;
  }
  async function loadWithRuffle(player, source) {
    if (player.ruffle && typeof player.ruffle === 'function') {
      const api = player.ruffle();
      if (api && typeof api.load === 'function') return await api.load(source);
    }
    if (typeof player.load === 'function') return await player.load(source);
    throw new Error('Ruffle load API를 찾을 수 없음');
  }
  async function runEmbeddedMode() {
    currentMode = 'embedded';
    clearDiag();
    setStatus('loading', '내장 SWF 실행 중...');
    try {
      await waitForRuffle(10000);
      addDiag('Ruffle', 'local ruffle/ruffle.js loaded', 'ok');
      addDiag('SWF', JSON.stringify(SWF_INFO), 'ok');
      const bytes = base64ToUint8Array(EMBEDDED_SWF_BASE64_CHUNKS);
      addDiag('Embedded bytes', bytes.length + ' bytes / magic=' + String.fromCharCode(bytes[0], bytes[1], bytes[2]), 'ok');
      const player = createPlayer();
      try {
        await loadWithRuffle(player, {
          data: bytes,
          swfFileName: 'game.swf',
          base: new URL('assets/', location.href).href,
          autoplay: 'on',
          unmuteOverlay: 'hidden',
          splashScreen: false,
          preloader: false,
          allowScriptAccess: true,
          allowNetworking: 'all',
          upgradeToHttps: false,
          compatibilityRules: true,
          showSwfDownload: true,
          scale: 'showAll',
          forceScale: true
        });
        setStatus('ok', '실행 중');
        return;
      } catch (dataErr) {
        addDiag('Embedded data failed', String(dataErr), 'warn');
        const blob = new Blob([bytes], { type: 'application/x-shockwave-flash' });
        const blobUrl = URL.createObjectURL(blob);
        clearStage();
        const retryPlayer = createPlayer();
        await loadWithRuffle(retryPlayer, blobUrl);
        setStatus('ok', 'Blob 방식으로 실행 중');
      }
    } catch (e) {
      setStatus('error', '실행 실패');
      addDiag('ERROR', String(e), 'err');
      makeError('ERR_RUFFLE_RUN_FAILED', diagLines.join('\n'));
    }
  }
  async function runUrlMode() {
    currentMode = 'url';
    clearDiag();
    setStatus('loading', '파일 경로 실행 중...');
    try {
      await waitForRuffle(10000);
      for (const url of SWF_URLS) {
        const fullUrl = url + '?v=' + Date.now();
        try {
          const res = await fetch(fullUrl, { cache: 'no-store' });
          const buf = await res.arrayBuffer();
          const magic = buf.byteLength >= 3 ? String.fromCharCode(...new Uint8Array(buf.slice(0,3))) : '';
          addDiag(url, 'HTTP ' + res.status + ' / ' + buf.byteLength + ' bytes / magic=' + magic, res.ok ? 'ok' : 'err');
          if (!res.ok || magic !== 'CWS') throw new Error(url + ' fetch failed or invalid magic: ' + magic);
          const player = createPlayer();
          await loadWithRuffle(player, fullUrl);
          setStatus('ok', '파일 경로로 실행 중');
          return;
        } catch (inner) {
          addDiag('URL failed', url + ' / ' + String(inner), 'warn');
        }
      }
      throw new Error('assets/game.swf, game.swf 모두 실행 실패');
    } catch (e) {
      setStatus('error', '파일 실행 실패');
      addDiag('ERROR', String(e), 'err');
      makeError('ERR_SWF_URL_FAILED', diagLines.join('\n'));
    }
  }
  function runFile(file) {
    if (!file) return;
    currentMode = 'file';
    clearDiag();
    setStatus('loading', '선택한 SWF 실행 중...');
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        await waitForRuffle(10000);
        const bytes = new Uint8Array(reader.result);
        addDiag('Selected file', file.name + ' / ' + bytes.length + ' bytes', 'ok');
        const player = createPlayer();
        await loadWithRuffle(player, { data: bytes, swfFileName: file.name, base: location.href });
        setStatus('ok', '선택한 SWF 실행 중');
      } catch (e) {
        setStatus('error', '선택 파일 실행 실패');
        addDiag('ERROR', String(e), 'err');
        makeError('ERR_SELECTED_SWF_FAILED', diagLines.join('\n'));
      }
    };
    reader.readAsArrayBuffer(file);
  }
  btnReload.addEventListener('click', () => currentMode === 'url' ? runUrlMode() : runEmbeddedMode());
  btnEmbedded.addEventListener('click', runEmbeddedMode);
  btnUrl.addEventListener('click', runUrlMode);
  btnFullscreen.addEventListener('click', () => {
    const target = rufflePlayer || stage;
    if (target && typeof target.enterFullscreen === 'function') target.enterFullscreen();
    else if (target && target.requestFullscreen) target.requestFullscreen();
  });

    const text = diagLines.join('\n');
    try { await navigator.clipboard.writeText(text); addDiag('Copy', 'diagnostics copied', 'ok'); } catch (e) { addDiag('Copy failed', String(e), 'warn'); }
  });
  fileInput.addEventListener('change', e => runFile(e.target.files && e.target.files[0]));

  stageWrap.addEventListener('dragleave', e => { if (!stageWrap.contains(e.relatedTarget)) dropOverlay.classList.remove('visible'); });
  stageWrap.addEventListener('drop', e => {
    e.preventDefault();
    dropOverlay.classList.remove('visible');
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file && file.name.toLowerCase().endsWith('.swf')) runFile(file);
  });
  stage.addEventListener('click', () => stage.focus());
  window.addEventListener('error', e => { addDiag('WINDOW ERROR', e.message, 'err'); });
  window.addEventListener('unhandledrejection', e => { addDiag('PROMISE ERROR', String(e.reason), 'err'); });
  document.addEventListener('DOMContentLoaded', runEmbeddedMode);
})();
</script>
</body>
</html>
